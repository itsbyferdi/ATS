name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the code. Pull requests from forks therefore cannot use the
# token to write to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Engine B for the API. Without it the API still runs and reports it as unavailable.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
